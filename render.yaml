databases:
  - name: mictseta-db
    plan: free
    databaseName: mictseta
    user: mictseta

services:
  - type: web
    name: mictseta-recruitment-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn mictseta_recruitment_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mictseta-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"
